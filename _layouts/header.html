<header class="topbar">
  <div class="topbar-inner">
    <a class="topbar-brand" href="{{site_path}}" rel="home">
      <img class="brand-logo" src="{{site_path}}logo.svg" alt="hsh home" width="30" height="30" />
      <span class="brand-word" aria-hidden="true">hsh</span>
      <span class="brand-badge" aria-hidden="true">0.0.10</span>
    </a>

    <!-- Always present; skeletonic hides it from 64em up. -->
    <button class="topbar-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navMenu">
      <span class="visually-hidden">Menu</span>
      <span class="topbar-toggle-icon" aria-hidden="true"></span>
    </button>

    <div class="topbar-panel" id="navMenu">
      <nav class="topbar-nav" aria-label="Primary">
        <ul class="topbar-links">
          <li><a class="topbar-link" href="{{site_path}}features/" {{#if nav_features}}aria-current="page"{{/if}}>Features</a></li>
          <li><a class="topbar-link" href="{{site_path}}getting-started/" {{#if nav_docs}}aria-current="page"{{/if}}>Get started</a></li>
          <li><a class="topbar-link" href="{{site_path}}migration/" {{#if nav_migration}}aria-current="page"{{/if}}>Migrate</a></li>
          <li><a class="topbar-link" href="{{site_path}}security/" {{#if nav_security}}aria-current="page"{{/if}}>Security</a></li>
          <li><a class="topbar-link" href="{{site_path}}faqs/" {{#if nav_faqs}}aria-current="page"{{/if}}>FAQ</a></li>
        </ul>
      </nav>

      <div class="topbar-actions">

        <!-- Search trigger slot; the generator replaces it with its button. -->
        <span data-ssg-search></span>

        <button class="theme-toggle" id="mode-toggle" type="button" data-label-light="Light" data-label-dark="Dark">
          <span class="visually-hidden">Theme</span>
          <span class="visually-hidden" id="mode-state" data-label-system="System">System</span>
          <span class="theme-icon" aria-hidden="true"></span>
        </button>

        <a href="{{site_path}}getting-started/" class="topbar-cta">
          <span>Get hsh</span>
        </a>
      </div>
    </div>
  </div>
</header>
