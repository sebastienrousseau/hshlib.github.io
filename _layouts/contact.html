{{#extends "base"}}
{{#block "main"}}
<article class="section page-shell">
  <div class="container page-grid">
    <header><p class="eyebrow">{{eyebrow}}</p><h1>{{headline}}</h1><p class="lead">{{lead}}</p></header>
    <div class="contact-body">
      <div class="prose">{{!content}}</div>
      <!--
        Posts to hshlib.com's Formspree endpoint, the same one the earlier
        site used; base.html allows that origin in the form-action policy.
      -->
      <form class="contact-form" action="https://formspree.io/f/mpzgbnjk" method="post">
        <div class="field">
          <label for="cf-name">Your name</label>
          <input id="cf-name" name="name" type="text" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="cf-email">Email</label>
          <input id="cf-email" name="email" type="email" autocomplete="email" aria-describedby="cf-email-hint" required />
          <p class="field-hint" id="cf-email-hint">Used only to reply to you.</p>
        </div>
        <div class="field">
          <label for="cf-message">Message</label>
          <textarea id="cf-message" name="message" rows="6" required></textarea>
        </div>
        <button class="button button-primary" type="submit">Send message</button>
      </form>
    </div>
  </div>
</article>
{{/block}}
