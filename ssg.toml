# Site configuration for hshlib.com, built with `make build`.
# The paths are relative to the repository root.

site_name = "hsh"
site_title = "hsh: password hashing for Rust"
site_description = "hsh is a password hashing library for Rust: Argon2id, bcrypt, scrypt and PBKDF2 behind one policy, PHC strings, rehash on login when the policy changes, a versioned pepper and a FIPS 140-3 mode."
base_url = "https://hshlib.com"
language = "en-GB"

content_dir = "_posts"
template_dir = "_layouts"
output_dir = "docs"

# Agentic discovery: /agents.txt, /.well-known/ai-plugin.json and
# /.well-known/mcp.json. Permissive, because the site exists to be read.
[agents]
agents_txt = true
ai_plugin = true

[agents.mcp]
enabled = true

# Security headers for hosts that read `_headers`. GitHub Pages ignores the
# file; it is kept so the same build deploys elsewhere with the headers.
[edge_headers]
targets = ["netlify", "cloudflare"]
